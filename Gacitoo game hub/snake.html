<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake - GameVerse</title>
    <style>
      :root {
        --accent: #38bdf8;
        --text: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(
          180deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
      }

      .container {
        text-align: center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #6bcf7f;
      }

      .difficulty-selector {
        margin-bottom: 2rem;
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 0.8rem 1.5rem;
        border: 2px solid var(--accent);
        border-radius: 0.8rem;
        background: rgba(30, 41, 59, 0.8);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .btn:hover,
      .btn.active {
        background: linear-gradient(135deg, var(--accent), #0ea5e9);
        color: #000;
        transform: scale(1.05);
      }

      #canvas {
        border: 3px solid var(--accent);
        border-radius: 1rem;
        background: linear-gradient(135deg, #2c3e50, #3d5a6c);
        display: block;
        margin: 2rem auto;
      }

      .stats {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .stat {
        background: rgba(30, 41, 59, 0.8);
        padding: 1rem;
        border-radius: 0.8rem;
        border-left: 4px solid var(--accent);
        min-width: 120px;
      }

      .stat div:first-child {
        font-size: 0.9rem;
        color: #94a3b8;
      }

      .stat div:last-child {
        font-size: 1.5rem;
        font-weight: bold;
        color: #6bcf7f;
      }

      .controls {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .instructions {
        margin-top: 1rem;
        color: #94a3b8;
        font-size: 0.9rem;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 1.8rem;
        }

        #canvas {
          max-width: 90vw;
        }
      }
    </style>
  </head>
  <body>
    <div class="ball"></div>
    <h1>🐍 Snake Game</h1>

    <div class="difficulty-selector">
      <button class="btn" onclick="selectDifficulty('easy')">🟢 Easy</button>
      <button class="btn active" onclick="selectDifficulty('normal')">
        🟡 Normal
      </button>
      <button class="btn" onclick="selectDifficulty('hard')">🔴 Hard</button>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <div class="stats">
      <div class="stat">
        <div>Score</div>
        <div id="score">0</div>
      </div>
      <div class="stat">
        <div>High Score</div>
        <div id="highScore">0</div>
      </div>
    </div>

    <div class="instructions">Use Arrow Keys to move | Spacebar to pause</div>

    <div class="controls">
      <button class="btn" id="pauseBtn" onclick="togglePause()">Pause</button>
      <button class="btn" onclick="startGame()">New Game</button>
      <button class="btn" onclick="goHome()">Back to Home</button>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const gridSize = 20;
      const tileCount = canvas.width / gridSize;

      let snake = [{ x: 10, y: 10 }];
      let food = { x: 15, y: 15 };
      let direction = { x: 1, y: 0 };
      let nextDirection = { x: 1, y: 0 };
      let score = 0;
      let highScore = localStorage.getItem("snakeHighScore") || 0;
      let gameRunning = false;
      let gamePaused = false;
      let difficulty = "normal";
      let gameSpeed = { easy: 130, normal: 95, hard: 50 };

      document.getElementById("highScore").textContent = highScore;

      const keyMap = {};

      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();

        if (key === " ") {
          e.preventDefault();
          togglePause();
          return;
        }

        const keyDirection = {
          arrowup: { x: 0, y: -1 },
          arrowdown: { x: 0, y: 1 },
          arrowleft: { x: -1, y: 0 },
          arrowright: { x: 1, y: 0 },
          w: { x: 0, y: -1 },
          s: { x: 0, y: 1 },
          a: { x: -1, y: 0 },
          d: { x: 1, y: 0 },
        };

        if (key in keyDirection) {
          const newDir = keyDirection[key];
          if (
            !(
              nextDirection.x + newDir.x === 0 &&
              nextDirection.y + newDir.y === 0
            )
          ) {
            nextDirection = newDir;
          }
        }
      });

      function selectDifficulty(level) {
        difficulty = level;
        document
          .querySelectorAll(".difficulty-selector .btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
        startGame();
      }

      function drawGame() {
        // Clear canvas
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw grid
        ctx.strokeStyle = "rgba(120, 100, 70, 0.1)";
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= tileCount; i++) {
          ctx.beginPath();
          ctx.moveTo(i * gridSize, 0);
          ctx.lineTo(i * gridSize, canvas.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, i * gridSize);
          ctx.lineTo(canvas.width, i * gridSize);
          ctx.stroke();
        }

        // Draw snake
        snake.forEach((segment, index) => {
          if (index === 0) {
            ctx.fillStyle = "#6bcf7f";
          } else {
            ctx.fillStyle = "rgba(254,142,128 0.7)";
          }
          ctx.fillRect(
            segment.x * gridSize + 1,
            segment.y * gridSize + 1,
            gridSize - 1,
            gridSize - 1,
          );
        });

        // Draw food
        ctx.fillStyle = "#ffd93d";
        ctx.beginPath();
        ctx.arc(
          (food.x + 0.5) * gridSize,
          (food.y + 0.5) * gridSize,
          gridSize / 2 - 2,
          0,
          Math.PI * 2,
        );
        ctx.fill();
      }

      function update() {
        if (gamePaused) return;

        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y,
        };

        // Check wall collision
        if (
          head.x < 0 ||
          head.x >= tileCount ||
          head.y < 0 ||
          head.y >= tileCount
        ) {
          endGame();
          return;
        }

        // Check self collision
        if (snake.some((seg) => seg.x === head.x && seg.y === head.y)) {
          endGame();
          return;
        }

        snake.unshift(head);

        // Check food collision
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          document.getElementById("score").textContent = score;
          spawnFood();
        } else {
          snake.pop();
        }
      }

      function spawnFood() {
        do {
          food.x = Math.floor(Math.random() * tileCount);
          food.y = Math.floor(Math.random() * tileCount);
        } while (snake.some((seg) => seg.x === food.x && seg.y === food.y));
      }

      function startGame() {
        snake = [{ x: 10, y: 10 }];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        gamePaused = false;
        gameRunning = true;

        document.getElementById("score").textContent = score;
        document.getElementById("pauseBtn").textContent = "Pause";

        spawnFood();
        gameLoop();
      }

      function togglePause() {
        if (!gameRunning) return;
        gamePaused = !gamePaused;
        document.getElementById("pauseBtn").textContent = gamePaused
          ? "Resume"
          : "Pause";
      }

      function endGame() {
        gameRunning = false;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("snakeHighScore", highScore);
          document.getElementById("highScore").textContent = highScore;
        }
        alert(`Game Over! Score: ${score}`);
      }

      function goHome() {
        gameRunning = false;
        window.location.href = "/HELLO%20WORLD/index.html";
      }

      function gameLoop() {
        update();
        drawGame();

        if (gameRunning) {
          setTimeout(gameLoop, gameSpeed[difficulty]);
        }
      }

      drawGame();
    </script>
  </body>
</html>
