<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe - GameVerse</title>
    <style>
      :root {
        --accent: #38bdf8;
        --text: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(
          180deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #38bdf8;
      }

      .mode-selector {
        margin-bottom: 2rem;
        display: flex;
        gap: 1rem;
        justify-content: center;
      }

      .btn {
        padding: 0.8rem 1.5rem;
        border: 2px solid var(--accent);
        border-radius: 0.8rem;
        background: rgba(30, 41, 59, 0.8);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
        font-size: 1rem;
      }

      .btn:hover,
      .btn.active {
        background: linear-gradient(135deg, var(--accent), #0ea5e9);
        color: #000;
        transform: scale(1.05);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        gap: 10px;
        margin: 2rem auto;
        background: rgba(30, 41, 59, 0.8);
        padding: 1rem;
        border-radius: 1rem;
        border: 2px solid var(--accent);
      }

      .cell {
        width: 100px;
        height: 100px;
        background: rgba(15, 23, 42, 0.9);
        border: 2px solid var(--accent);
        border-radius: 0.5rem;
        font-size: 2rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cell:hover {
        background: rgba(56, 189, 248, 0.1);
        transform: scale(1.05);
      }

      .cell.x {
        color: #ff6b6b;
      }

      .cell.o {
        color: #38bdf8;
      }

      .status {
        font-size: 1.5rem;
        margin: 1rem 0;
        height: 2rem;
      }

      .controls {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 2rem;
      }

      @media (max-width: 600px) {
        .board {
          grid-template-columns: repeat(3, 80px);
        }

        .cell {
          width: 80px;
          height: 80px;
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎯 Tic Tac Toe</h1>

      <div class="mode-selector">
        <button class="btn active" onclick="selectMode('ai')">
          Play vs AI
        </button>
        <button class="btn" onclick="selectMode('2player')">2 Player</button>
      </div>

      <div class="status" id="status">Your turn (X)</div>

      <div class="board" id="board">
        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>
        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>
        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>
      </div>

      <div class="controls">
        <button class="btn" onclick="resetGame()">New Game</button>
        <button class="btn" onclick="goHome()">Back to Home</button>
      </div>
    </div>

    <script>
      let board = ["", "", "", "", "", "", "", "", ""];
      let currentPlayer = "X";
      let gameActive = true;
      let mode = "ai";
      let cells = document.querySelectorAll(".cell");

      const winCombos = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      function selectMode(newMode) {
        mode = newMode;
        resetGame();
        document
          .querySelectorAll(".mode-selector .btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }

      function makeMove(index) {
        if (!gameActive || board[index] !== "") return;

        board[index] = currentPlayer;
        cells[index].textContent = currentPlayer;
        cells[index].classList.add(currentPlayer.toLowerCase());

        if (checkWinner()) {
          document.getElementById("status").textContent =
            `${currentPlayer} wins! 🎉`;
          gameActive = false;
          return;
        }

        if (board.every((cell) => cell !== "")) {
          document.getElementById("status").textContent = "It's a draw! 🤝";
          gameActive = false;
          return;
        }

        if (mode === "ai" && currentPlayer === "X") {
          currentPlayer = "O";
          setTimeout(aiMove, 300);
        } else {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
          updateStatus();
        }
      }

      function aiMove() {
        const available = board
          .map((val, idx) => (val === "" ? idx : null))
          .filter((val) => val !== null);
        const move = available[Math.floor(Math.random() * available.length)];
        board[move] = "O";
        cells[move].textContent = "O";
        cells[move].classList.add("o");

        if (checkWinner()) {
          document.getElementById("status").textContent = `AI (O) wins! 🤖`;
          gameActive = false;
          return;
        }

        if (board.every((cell) => cell !== "")) {
          document.getElementById("status").textContent = "It's a draw! 🤝";
          gameActive = false;
          return;
        }

        currentPlayer = "X";
        updateStatus();
      }

      function checkWinner() {
        return winCombos.some((combo) => {
          return (
            board[combo[0]] !== "" &&
            board[combo[0]] === board[combo[1]] &&
            board[combo[1]] === board[combo[2]]
          );
        });
      }

      function updateStatus() {
        if (gameActive) {
          document.getElementById("status").textContent =
            mode === "ai" ? "Your turn (X)" : `${currentPlayer}'s turn`;
        }
      }

      function resetGame() {
        board = ["", "", "", "", "", "", "", "", ""];
        currentPlayer = "X";
        gameActive = true;
        cells.forEach((cell) => {
          cell.textContent = "";
          cell.className = "cell";
        });
        updateStatus();
      }

      function goHome() {
        window.location.href = "/HELLO%20WORLD/index.html";
      }

      // Initialize cells reference
      cells = document.querySelectorAll(".cell");
    </script>
  </body>
</html>
