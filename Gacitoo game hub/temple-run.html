<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temple Run - GameVerse</title>
    <style>
      :root {
        --accent: #38bdf8;
        --accent-strong: #0ea5e9;
        --text: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(
          180deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
      }

      .game-container {
        width: 90%;
        max-width: 600px;
      }

      .game-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .game-header h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        color: #ff6b6b;
      }

      .game-modes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .difficulty-btn {
        padding: 1rem;
        border: 2px solid var(--accent);
        border-radius: 0.8rem;
        background: rgba(30, 41, 59, 0.8);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .difficulty-btn:hover,
      .difficulty-btn.active {
        background: linear-gradient(
          135deg,
          var(--accent),
          var(--accent-strong)
        );
        color: #000;
        transform: scale(1.05);
      }

      .game-board {
        background: linear-gradient(135deg, #2c3e50, #3d5a6c);
        border: 3px solid var(--accent);
        border-radius: 1rem;
        width: 100%;
        height: 500px;
        position: relative;
        overflow: hidden;
        display: none;
      }

      .game-board.active {
        display: block;
      }

      .player {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #ff6b6b;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 0.4rem;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .obstacle {
        position: absolute;
        width: 60px;
        height: 60px;
        background: #ffd93d;
        border-radius: 0.4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
      }

      .coin {
        position: absolute;
        width: 30px;
        height: 30px;
        background: #6bcf7f;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        font-weight: bold;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        margin-top: 1.5rem;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .hud-item {
        background: rgba(30, 41, 59, 0.8);
        padding: 1rem;
        border-radius: 0.8rem;
        border-left: 4px solid var(--accent);
        flex: 1;
        min-width: 120px;
      }

      .hud-item > div:first-child {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 0.3rem;
      }

      .hud-item > div:last-child {
        font-size: 1.8rem;
        font-weight: bold;
        color: var(--accent);
      }

      .controls {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 1.5rem;
      }

      .btn {
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 0.8rem;
        background: linear-gradient(
          135deg,
          var(--accent),
          var(--accent-strong)
        );
        color: #000;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
      }

      .btn-secondary {
        background: rgba(148, 163, 184, 0.2);
        border: 2px solid var(--accent);
        color: var(--text);
      }

      .btn-secondary:hover {
        background: rgba(56, 189, 248, 0.1);
      }

      .start-screen,
      .game-over-screen {
        background: rgba(30, 41, 59, 0.95);
        border: 2px solid var(--accent);
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
        margin-top: 2rem;
      }

      .start-screen h2,
      .game-over-screen h2 {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: var(--accent);
      }

      .start-screen p,
      .game-over-screen p {
        color: var(--text-muted);
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }

      .game-over-screen {
        display: none;
      }

      .game-over-screen.active {
        display: block;
      }

      .score-display {
        font-size: 1.5rem;
        color: #6bcf7f;
        margin-bottom: 1rem;
        font-weight: bold;
      }

      @media (max-width: 600px) {
        .game-board {
          height: 400px;
        }

        .game-header h1 {
          font-size: 1.8rem;
        }

        .difficulty-btn {
          padding: 0.8rem;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-header">
        <h1>🏃 Temple Run</h1>
        <p>Use Arrow Keys or WASD to move</p>
      </div>

      <div class="game-modes">
        <button
          class="difficulty-btn active"
          onclick="selectDifficulty('easy')"
        >
          🟢 Easy
        </button>
        <button class="difficulty-btn" onclick="selectDifficulty('normal')">
          🟡 Normal
        </button>
        <button class="difficulty-btn" onclick="selectDifficulty('hard')">
          🔴 Hard
        </button>
        <button class="difficulty-btn" onclick="selectDifficulty('insane')">
          💀 Insane
        </button>
      </div>

      <div class="start-screen" id="startScreen">
        <h2>Ready to Run?</h2>
        <p>
          Dodge obstacles, collect coins, and stay alive as long as possible!
        </p>
        <button class="btn" onclick="startGame()">Start Game</button>
      </div>

      <div class="game-board" id="gameBoard">
        <div class="player" id="player">🏃</div>
      </div>

      <div class="game-over-screen" id="gameOverScreen">
        <h2>Game Over!</h2>
        <div class="score-display">
          Final Score: <span id="finalScore">0</span>
        </div>
        <p>
          Coins Collected:
          <span style="color: #6bcf7f; font-weight: bold" id="finalCoins"
            >0</span
          ><br />
          Obstacles Avoided:
          <span
            style="color: var(--accent); font-weight: bold"
            id="finalObstacles"
            >0</span
          >
        </p>
        <button class="btn" onclick="restartGame()">Play Again</button>
        <button class="btn btn-secondary" onclick="goHome()">Go Home</button>
      </div>

      <div class="hud">
        <div class="hud-item">
          <div>Score</div>
          <div id="score">0</div>
        </div>
        <div class="hud-item">
          <div>Coins</div>
          <div id="coins">0</div>
        </div>
        <div class="hud-item">
          <div>Time</div>
          <div id="time">0s</div>
        </div>
      </div>

      <div class="controls">
        <button
          class="btn"
          id="pauseBtn"
          onclick="togglePause()"
          style="display: none"
        >
          Pause
        </button>
        <button class="btn btn-secondary" onclick="goHome()">
          Back to Home
        </button>
      </div>
    </div>

    <script src="temple-run.js"></script>
  </body>
</html>
